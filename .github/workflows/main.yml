name: Main Branch Workflow

on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: 8
      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
      - name: Build with Maven
        working-directory: ./app
        run: mvn clean package

      - uses: actions/upload-artifact@v4
        with:
          name: verademo.war
          path: app/target/verademo.war

  policy_scan:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v3
      - name: get archive
        uses: actions/download-artifact@v4
        with:
          name: verademo.war
          path: .
      
      #- name: veracode Upload and scan Action step
       # uses: veracode/Veracode-pipeline-scan-action@master
        #id: upload_and_scan  
        #with:
         # file: 'verademo.war'
          #vid: ${{ secrets.VERACODE_API_ID}}
          #vkey: ${{ secrets.VERACODE_API_KEY}}
          #appname: 'STATIC GITHUB'
          #createprofile: true
          #version: 'Build-${{ github.run_id }}'

      - name: Veracode Upload and Scan
  uses: veracode/veracode-uploadandscan-action@master
  with:
    appname: 'STATIC GITHUB'              # Nombre del perfil de aplicación
    createprofile: true                  # Crea el perfil si no existe
    version: 'Build-${{ github.run_id }}'
    filepath: 'verademo.war'             # Ruta al archivo .war
    vid: ${{ secrets.VERACODE_API_ID }}
    vkey: ${{ secrets.VERACODE_API_KEY }}

          
